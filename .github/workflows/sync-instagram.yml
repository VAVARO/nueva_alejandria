name: Sincronizar Publicaciones de Instagram

on:
  schedule:
    # Se ejecuta automáticamente todos los días cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecución manual inmediata con un clic desde la pestaña "Actions" en GitHub

permissions:
  contents: write

jobs:
  sync-instagram:
    name: Sincronizar Feed de @aledealejandria
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar script de sincronización
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node .github/scripts/sync-instagram.js

      - name: Verificar cambios y realizar commit automático
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ nueva_alejandría.html conversaciones.html
          if git diff --staged --quiet; then
            echo "No hay nuevas publicaciones para actualizar en este ciclo."
          else
            git commit -m "chore(instagram): actualizar automáticamente las 3 últimas publicaciones de @aledealejandria [skip ci]"
            git push
          fi
